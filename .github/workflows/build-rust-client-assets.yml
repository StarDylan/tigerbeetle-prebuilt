name: Build Rust client assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-assets:
    name: Build and commit Rust client assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TigerBeetle
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download pinned Zig
        shell: bash
        run: |
          ./zig/download.sh

      - name: Build Rust client assets
        shell: bash
        env:
          CI: "false"
        run: |
          ./zig/zig build clients:rust -Drelease

      - name: Verify generated assets
        shell: bash
        run: |
          test -f src/clients/rust/assets/lib/x86_64-windows/tb_client.lib
          test -f src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a
          test -f src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            src/clients/rust/assets/lib/x86_64-windows/tb_client.lib \
            src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/tb_client.h

          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
          else
            git commit -m "Add Rust client native assets"
            git push
          fi
