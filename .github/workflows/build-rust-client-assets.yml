name: Build Rust client assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-assets:
    name: Build Linux Rust client assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TigerBeetle
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download pinned Zig
        shell: bash
        run: |
          ./zig/download.sh

      - name: Build Rust client assets
        shell: bash
        run: |
          ./zig/zig build clients:rust -Drelease

      - name: Verify Linux assets
        shell: bash
        run: |
          test -f src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a
          test -f src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: rust-client-linux-assets
          path: |
            src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a
            src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

  build-windows-assets:
    name: Build Windows Rust client asset
    runs-on: windows-latest

    steps:
      - name: Checkout TigerBeetle
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download pinned Zig
        shell: pwsh
        run: |
          .\zig\download.ps1

      - name: Build Rust client assets
        shell: pwsh
        run: |
          .\zig\zig.exe build clients:rust -Drelease

      - name: Verify Windows asset
        shell: pwsh
        run: |
          $lib = "src\clients\rust\assets\lib\x86_64-windows\tb_client.lib"
          if (!(Test-Path $lib)) {
            Write-Error "Missing expected file: $lib"
            exit 1
          }

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: rust-client-windows-assets
          path: src/clients/rust/assets/lib/x86_64-windows/tb_client.lib

  commit-assets:
    name: Commit generated assets
    runs-on: ubuntu-latest
    needs:
      - build-linux-assets
      - build-windows-assets

    steps:
      - name: Checkout TigerBeetle
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          path: downloaded-assets

      - name: Place generated assets
        shell: bash
        run: |
          mkdir -p src/clients/rust/assets/lib/x86_64-windows
          mkdir -p src/clients/rust/assets/lib/x86_64-linux-gnu.2.27
          mkdir -p src/clients/rust/assets/lib/aarch64-linux-gnu.2.27

          cp downloaded-assets/rust-client-windows-assets/tb_client.lib \
            src/clients/rust/assets/lib/x86_64-windows/tb_client.lib

          cp downloaded-assets/rust-client-linux-assets/x86_64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a

          cp downloaded-assets/rust-client-linux-assets/aarch64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

      - name: Verify all committed assets
        shell: bash
        run: |
          test -f src/clients/rust/assets/lib/x86_64-windows/tb_client.lib
          test -f src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a
          test -f src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            src/clients/rust/assets/lib/x86_64-windows/tb_client.lib \
            src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
          else
            git commit -m "Add Rust client native assets"
            git push
          fi
