name: Build Rust client assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-assets:
    name: Build Windows x86_64 MSVC asset
    runs-on: windows-latest

    steps:
      - name: Checkout TigerBeetle
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Rust client assets
        shell: pwsh
        run: |
          .\zig\zig.exe build clients:rust -Drelease

      - name: Verify Windows asset
        shell: pwsh
        run: |
          $lib = "src\clients\rust\assets\lib\x86_64-windows\tb_client.lib"
          if (!(Test-Path $lib)) {
            Write-Error "Missing expected file: $lib"
            exit 1
          }

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: rust-client-windows-x86_64
          path: src/clients/rust/assets/lib/x86_64-windows/tb_client.lib

  build-linux-assets:
    name: Build Linux GNU assets
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: x86_64-linux-gnu.2.27
            zig_target: x86_64-linux-gnu.2.27
          - arch_name: aarch64-linux-gnu.2.27
            zig_target: aarch64-linux-gnu.2.27

    steps:
      - name: Checkout TigerBeetle
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Rust client asset
        shell: bash
        run: |
          ./zig/zig build clients:rust -Drelease -Dtarget=${{ matrix.zig_target }}

      - name: Verify Linux asset
        shell: bash
        run: |
          lib="src/clients/rust/assets/lib/${{ matrix.arch_name }}/libtb_client.a"
          if [ ! -f "$lib" ]; then
            echo "Missing expected file: $lib"
            exit 1
          fi

      - name: Upload Linux asset
        uses: actions/upload-artifact@v4
        with:
          name: rust-client-${{ matrix.arch_name }}
          path: src/clients/rust/assets/lib/${{ matrix.arch_name }}/libtb_client.a

  commit-assets:
    name: Commit generated assets
    runs-on: ubuntu-latest
    needs:
      - build-windows-assets
      - build-linux-assets

    steps:
      - name: Checkout TigerBeetle
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          path: downloaded-assets

      - name: Place generated assets
        shell: bash
        run: |
          mkdir -p src/clients/rust/assets/lib/x86_64-windows
          mkdir -p src/clients/rust/assets/lib/x86_64-linux-gnu.2.27
          mkdir -p src/clients/rust/assets/lib/aarch64-linux-gnu.2.27

          cp downloaded-assets/rust-client-windows-x86_64/tb_client.lib \
            src/clients/rust/assets/lib/x86_64-windows/tb_client.lib

          cp downloaded-assets/rust-client-x86_64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a

          cp downloaded-assets/rust-client-aarch64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

      - name: Verify all assets
        shell: bash
        run: |
          test -f src/clients/rust/assets/lib/x86_64-windows/tb_client.lib
          test -f src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a
          test -f src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            src/clients/rust/assets/lib/x86_64-windows/tb_client.lib \
            src/clients/rust/assets/lib/x86_64-linux-gnu.2.27/libtb_client.a \
            src/clients/rust/assets/lib/aarch64-linux-gnu.2.27/libtb_client.a

          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
          else
            git commit -m "Add Rust client native assets"
            git push
          fi
